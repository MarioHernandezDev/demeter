      <circle cx="0" cy="-9" r="4.5" fill="url(#goldTrim)" stroke="#694605" stroke-width="1.8"/>
      <circle cx="-4" cy="2" r="2.8" fill="#fff7bf" opacity="0.85"/>
      <circle id="av-tip" cx="0" cy="-9" r="1" fill="none"/>
    </g></g>

