      <line x1="8" y1="-12" x2="8" y2="-2" stroke="#16260c" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
  <g class="avocado-arm-right">
    <path d="M 266 235 C 266 218, 258 206, 248 206" fill="none" stroke="#223b14" stroke-width="14" stroke-linecap="round"/>
    <g transform="translate(246, 212)">
