      <line x1="0" y1="-13" x2="0" y2="-2" stroke="#16260c" stroke-width="2" stroke-linecap="round"/>
      <line x1="8" y1="-12" x2="8" y2="-2" stroke="#16260c" stroke-width="2" stroke-linecap="round"/>
