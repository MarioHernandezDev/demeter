<svg id="av-svg" viewBox="0 0 360 245" class="pl4__svg" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="avoOuterSkin" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2c4b1a"/><stop offset="100%" stop-color="#192e0d"/></linearGradient>
    <linearGradient id="avoRind" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#58852b"/><stop offset="100%" stop-color="#3c611a"/></linearGradient>
    <radialGradient id="avoFlesh" cx="48%" cy="42%" r="65%"><stop offset="0%" stop-color="#d2ec95"/><stop offset="65%" stop-color="#b4da69"/><stop offset="100%" stop-color="#92c246"/></radialGradient>
    <radialGradient id="avoPitTop" cx="42%" cy="30%" r="70%"><stop offset="0%" stop-color="#a66332"/><stop offset="60%" stop-color="#783f18"/><stop offset="100%" stop-color="#4e260b"/></radialGradient>
