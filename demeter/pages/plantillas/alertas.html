<main id="top">
  <section class="page page--top">
    <div class="page__in">
      <header class="ahead">
        <div><p class="kick">Finca La Costa · últimos 7 días</p><h1 class="h">Alertas</h1></div>
        <div class="ahead__n"><b data-unread-big>2</b><span>sin leer</span></div>
        <div class="ahead__n"><b>6</b><span>esta semana</span></div>
        <div class="ahead__n"><b>−40 %</b><span>que la semana pasada</span></div>
      </header>
      <div class="tl" data-timeline aria-label="Línea de tiempo de los avisos"></div>
      <div class="sec">
        <div class="sec__h"><h3>Avisos</h3>
          <span data-group style="display:flex;gap:6px"><button class="pill pill--s" aria-pressed="false" data-filter="unread">Sin leer</button><button class="pill pill--s" aria-pressed="true" data-filter="all">Todas</button></span>
          <button type="button" data-all-seen>Marcar todas como vistas</button></div>
        <ul class="alist2" data-alerts></ul>
      </div>
    </div>
  </section>
</main>

<div class="toast" role="status" hidden></div>
