<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Demeter · Demo gemelo digital (PNOA + MDT IGN)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px system-ui, sans-serif; background: #14181c; color: #e6e6e6; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 8px 14px; background: #1d2329; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #2c343c; }
  header h1 { font-size: 15px; margin: 0 10px 0 0; color: #9ccc65; }
  button { background: #2e7d32; color: #fff; border: 0; padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 13px; }
  button.sec { background: #37474f; }
  button.on { outline: 2px solid #9ccc65; background: #455a64; }
  button:disabled { opacity: .4; cursor: default; }
  label { font-size: 13px; display: flex; gap: 5px; align-items: center; }
  main { flex: 1; display: flex; min-height: 0; }
  #map, #view { flex: 1; position: relative; }
  #view canvas { display: block; }
  #info { position: absolute; left: 10px; top: 10px; background: #000b; padding: 8px 10px; border-radius: 6px; font-size: 12px; max-width: 330px; line-height: 1.45; pointer-events: none; }
  #status { font-size: 12px; color: #b0bec5; }
  .sep { width: 1px; height: 22px; background: #3a444d; }
  #edit { position: absolute; right: 10px; top: 10px; background: #000d; padding: 10px; border-radius: 6px; font-size: 13px; line-height: 1.6; }
  #edit button { padding: 3px 9px; margin-right: 4px; }
  #tools { position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; background: #000c; padding: 8px 10px; border-radius: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 96%; }
  #tools button { padding: 5px 9px; }
  #tools label { font-size: 12px; }
  #tools input[type=range] { width: 80px; }
  #tip { position: absolute; pointer-events: none; background: #000d; color: #ffe082; padding: 3px 7px; border-radius: 4px; font-size: 12px; white-space: nowrap; }
  #help { position: absolute; right: 10px; bottom: 120px; background: #000a; padding: 6px 9px; border-radius: 6px; font-size: 11px; line-height: 1.5; color: #cfd8dc; max-width: 260px; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <h1>Demeter · Gemelo digital (demo)</h1>
  <button id="bParcela">1 · Dibujar mi terreno</button>
  <button id="bGenerar">2 · Generar 3D</button>
  <span class="sep"></span>
  <label>Muro <input id="muro" type="range" min="0.5" max="3" step="0.25" value="1.5"><span id="muroV">1,5 m</span></label>
  <label title="Cuánto se suaviza el relieve antes de escalonarlo: bajo = muros sinuosos, alto = muros rectos">Suavizado <input id="suav" type="range" min="2" max="15" step="1" value="4"><span id="suavV">4 m</span></label>
  <label><input id="talud" type="checkbox"> Talud de tierra</label>
  <button id="bTodo" class="sec" disabled>Bancalizar todo</button>
  <button id="bZona" class="sec" disabled>Bancalizar zona</button>
  <button id="bLiso" class="sec" disabled>Zona lisa</button>
  <button id="bDeshacer" class="sec" disabled title="Ctrl+Z">Deshacer</button>
  <span class="sep"></span>
  <button id="bModo" class="sec" disabled>Ver: gemelo</button>
  <button id="bTex" class="sec" disabled>Textura: ortofoto</button>
  <label>Exageración <input id="exag" type="range" min="1" max="3" step="0.25" value="1"><span id="exagV">1×</span></label>
  <span id="status">Dibuja el contorno de tu terreno sobre la ortofoto PNOA.</span>
</header>
<main>
  <div id="map"></div>
  <div id="view">
    <div id="info">Aún no hay gemelo generado.</div>
    <div id="edit" hidden></div>
    <div id="tip" hidden></div>
    <div id="help" hidden></div>
    <div id="tools" hidden>
      <button data-tool="mover" class="sec on" title="Arrastra un bancal arriba/abajo · Alt+clic en un muro = fusionar">✋ Mover bancal</button>
      <button data-tool="subir" class="sec" title="Shift invierte">⬆ Subir</button>
      <button data-tool="bajar" class="sec" title="Shift invierte">⬇ Bajar</button>
      <button data-tool="aplanar" class="sec">▬ Aplanar</button>
      <button data-tool="suavizar" class="sec">≈ Suavizar</button>
      <button data-tool="muro" class="sec" title="Traza una línea que cruce el bancal">┃ Muro</button>
      <span class="sep"></span>
      <label>Tamaño <input id="bSize" type="range" min="1" max="20" step="0.5" value="5"><span id="bSizeV">5 m</span></label>
      <label>Fuerza <input id="bForce" type="range" min="1" max="10" step="1" value="5"></label>
    </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/proj4@2.11.0/dist/proj4.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Utilidades ----------
proj4.defs('EPSG:25830', '+proj=utm +zone=30 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs');
const toUTM = ll => proj4('EPSG:4326', 'EPSG:25830', [ll.lng, ll.lat]);
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('es-ES');
const fm = n => n.toFixed(2).replace('.', ',');
const status = t => $('status').textContent = t;
const N4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];

// ---------- Mapa 2D ----------
const map = L.map('map').setView([36.7585, -3.5300], 16);
const pnoa = L.tileLayer('https://www.ign.es/wmts/pnoa-ma?service=WMTS&request=GetTile&version=1.0.0&Format=image/jpeg&layer=OI.OrthoimageCoverage&style=default&tilematrixset=GoogleMapsCompatible&TileMatrix={z}&TileRow={y}&TileCol={x}',
  { maxZoom: 20, maxNativeZoom: 19, attribution: 'PNOA cedido por © <a href="https://www.ign.es">Instituto Geográfico Nacional</a>' }).addTo(map);
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
const catastro = L.tileLayer.wms('https://ovc.catastro.meh.es/Cartografia/WMS/ServidorWMS.aspx', {
  layers: 'Catastro', format: 'image/png', transparent: true, maxZoom: 20, attribution: '© Dirección General del Catastro' });
L.control.layers({ 'Ortofoto PNOA': pnoa, 'OpenStreetMap': osm }, { 'Lindes del Catastro': catastro }).addTo(map);
L.control.scale({ imperial: false }).addTo(map);
const parcelaLayer = new L.FeatureGroup().addTo(map);
const zonasLayer = new L.FeatureGroup().addTo(map);

// ---------- Dibujo en el mapa: clic = vértice · doble clic / Enter / clic en el primero / volver a pulsar = cerrar · Esc = cancelar ----------
const DRAW = { parcela: { btn: 'bParcela', color: '#9ccc65' }, bancal: { btn: 'bZona', color: '#ffb300' }, liso: { btn: 'bLiso', color: '#4fc3f7' } };
let mode = null, pts = [], temp = null, lastClick = 0;
function startDraw(kind) {
  cancelDraw(); mode = kind;
  map.doubleClickZoom.disable(); map.getContainer().style.cursor = 'crosshair';
  $(DRAW[kind].btn).classList.add('on');
  status('Clic para añadir vértices; doble clic o clic en el primero para cerrar. Esc cancela.');
}
function cancelDraw() {
  if (temp) map.removeLayer(temp); temp = null; mode = null; pts = [];
  map.doubleClickZoom.enable(); map.getContainer().style.cursor = '';
  Object.values(DRAW).forEach(d => $(d.btn).classList.remove('on'));
}
function finishDraw() {
  const kind = mode, ll = pts.slice(); cancelDraw();
  if (ll.length < 3) return;
  if (kind === 'parcela') {
    parcelaLayer.clearLayers(); zonasLayer.clearLayers();
    parcelaLayer.addLayer(L.polygon(ll, { color: DRAW.parcela.color, weight: 3, fillOpacity: .06 }));
    status(`Terreno dibujado: ${fmt(areaUTM(ll.map(toUTM)))} m². Pulsa «Generar 3D».`);
  } else addZona(kind, ll);
}
map.on('click', e => {
  if (!mode) return;
  const now = Date.now(), dbl = now - lastClick < 350 && pts.length && map.latLngToContainerPoint(pts[pts.length - 1]).distanceTo(e.containerPoint) < 8;
  lastClick = now;
  if (dbl) return finishDraw();
  if (pts.length >= 3 && map.latLngToContainerPoint(pts[0]).distanceTo(e.containerPoint) < 12) return finishDraw();
  pts.push(e.latlng);
  if (temp) map.removeLayer(temp);
  const c = DRAW[mode].color;
  temp = (pts.length >= 3 ? L.polygon(pts, { color: c, dashArray: '5 5', fillOpacity: .05 }) : L.polyline(pts, { color: c, dashArray: '5 5' })).addTo(map);
});
map.on('dblclick', () => { if (mode) finishDraw(); });
for (const k of Object.keys(DRAW)) $(DRAW[k].btn).onclick = () => mode === k ? finishDraw() : startDraw(k);

// ---------- Geometría ----------
function areaUTM(p) { let a = 0; for (let i = 0; i < p.length; i++) { const [x1, y1] = p[i], [x2, y2] = p[(i + 1) % p.length]; a += x1 * y2 - x2 * y1; } return Math.abs(a) / 2; }
function inside(x, y, p) { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, yi] = p[i], [xj, yj] = p[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
function boxBlur(src, nx, ny, rad, passes) {
  let a = Float32Array.from(src), b = new Float32Array(a.length);
  for (let p = 0; p < passes; p++) {
    for (let r = 0; r < ny; r++) for (let c = 0; c < nx; c++) { let s = 0, n = 0; for (let k = -rad; k <= rad; k++) { const cc = c + k; if (cc >= 0 && cc < nx) { s += a[r * nx + cc]; n++; } } b[r * nx + c] = s / n; }
    for (let r = 0; r < ny; r++) for (let c = 0; c < nx; c++) { let s = 0, n = 0; for (let k = -rad; k <= rad; k++) { const rr = r + k; if (rr >= 0 && rr < ny) { s += b[rr * nx + c]; n++; } } a[r * nx + c] = s / n; }
  }
  return a;
}

// ---------- Datos del IGN (a través del proxy local: server.py) ----------
async function fetchRetry(url, tries = 3, ms = 30000) {
  let last;
  for (let t = 0; t < tries; t++) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms);
    try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error(`HTTP ${r.status}`); return r; }
    catch (e) { last = e.name === 'AbortError' ? new Error('tiempo de espera agotado') : e; }
    finally { clearTimeout(timer); }
    await new Promise(res => setTimeout(res, 800 * (t + 1)));
  }
  throw last;
}
async function fetchMDT(x0, y0, x1, y1) {
  const url = `/proxy/mdt-wcs?SERVICE=WCS&VERSION=2.0.1&REQUEST=GetCoverage&CoverageId=Elevacion25830_5&SUBSET=x(${x0},${x1})&SUBSET=y(${y0},${y1})&FORMAT=application/asc`;
  let txt;
  try { txt = await (await fetchRetry(url)).text(); } catch (e) { throw new Error(`relieve MDT (${e.message || 'sin conexión'})`); }
  if (txt.indexOf('ncols') < 0) throw new Error(`relieve MDT (${(txt.match(/<ows:ExceptionText>([^<]*)/) || [])[1] || 'respuesta inesperada'})`);
  const tok = txt.slice(txt.indexOf('ncols')).split(/\s+/), hdr = {}; let i = 0;
  while (/[a-z]/i.test(tok[i]) && !isNaN(parseFloat(tok[i + 1]))) { hdr[tok[i].toLowerCase()] = parseFloat(tok[i + 1]); i += 2; }
  const n = hdr.ncols * hdr.nrows, z = new Float32Array(n);
  for (let k = 0; k < n; k++) z[k] = parseFloat(tok[i + k]);
  return { ...hdr, z };
}
function sampler(m) {
  const top = m.yllcorner + m.nrows * m.cellsize;
  return (x, y) => {
    let c = (x - m.xllcorner) / m.cellsize - .5, r = (top - y) / m.cellsize - .5;
    c = Math.max(0, Math.min(m.ncols - 1.001, c)); r = Math.max(0, Math.min(m.nrows - 1.001, r));
    const c0 = c | 0, r0 = r | 0, fc = c - c0, fr = r - r0, Z = m.z, W = m.ncols;
    return (Z[r0 * W + c0] * (1 - fc) + Z[r0 * W + c0 + 1] * fc) * (1 - fr) + (Z[(r0 + 1) * W + c0] * (1 - fc) + Z[(r0 + 1) * W + c0 + 1] * fc) * fr;
  };
}
async function loadOrtho(x0, y0, x1, y1) {
  const W = x1 - x0, H = y1 - y0;
  for (const max of [2048, 1024, 512]) {
    const px = Math.min(max, Math.round(Math.max(W, H) * 4));
    const url = `/proxy/pnoa-wms?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=OI.OrthoimageCoverage&STYLES=&CRS=EPSG:25830&BBOX=${x0},${y0},${x1},${y1}&WIDTH=${Math.round(px * W / Math.max(W, H))}&HEIGHT=${Math.round(px * H / Math.max(W, H))}&FORMAT=image/jpeg`;
    try {
      const blob = await (await fetchRetry(url, 2)).blob();
      if (!blob.type.startsWith('image/')) throw new Error('no es una imagen');
      const u = URL.createObjectURL(blob), tex = await new THREE.TextureLoader().loadAsync(u);
      URL.revokeObjectURL(u); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
      return tex;
    } catch (e) { console.warn(`Ortofoto ${max}px falló:`, e); }
  }
  return null;
}

// =====================================================================================
// MODELO DEL GEMELO
//   base   = relieve real + zonas (bancalizado automático / zonas lisas)   → se recalcula al cambiar zonas o suavizado
//   capa manual = offsets por bancal (arrastrar), bancales creados con «Muro», y "edit" (pinceles, metro a metro)
//   z final = base (con offsets) + edit
// =====================================================================================
let G = null;
const MANUAL = 1e6;                      // ids ≥ 1e6 = bancales creados a mano con la herramienta Muro
const compOf = l => l >= MANUAL ? G.manual[l - MANUAL] : G.base.comps[l];

function smoothFor(rm) {
  const rad = Math.max(1, Math.round(rm / G.res));
  if (!G.smoothCache.has(rad)) G.smoothCache.set(rad, boxBlur(G.raw, G.nx, G.ny, rad, 3));
  return G.smoothCache.get(rad);
}

function nivelesZona(zone, Zm, smooth) {
  const { nx, ny, res } = G, step = zone.step, lev = new Int32Array(nx * ny);
  for (const i of zone.cells) lev[i] = Math.round(smooth[i] / step);
  for (let pass = 0; pass < 2; pass++) {               // filtro de mayoría 3×3 → bordes limpios
    const out = Int32Array.from(lev);
    for (const i of zone.cells) {
      const c = i % nx, r = (i / nx) | 0, cnt = new Map();
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const cc = c + dc, rr = r + dr; if (cc < 0 || rr < 0 || cc >= nx || rr >= ny) continue;
        const j = rr * nx + cc; if (Zm[j]) cnt.set(lev[j], (cnt.get(lev[j]) || 0) + 1);
      }
      let best = lev[i], bn = 0; for (const [k, v] of cnt) if (v > bn) { bn = v; best = k; }
      if (bn >= 5) out[i] = best;
    }
    for (const i of zone.cells) lev[i] = out[i];
  }
  const minCells = Math.max(4, Math.round(12 / (res * res)));   // plataformas < 12 m² → se funden con la vecina
  for (let it = 0; it < 3; it++) {
    const lab = new Uint8Array(nx * ny); let changed = false;
    for (const s0 of zone.cells) {
      if (lab[s0]) continue;
      const cells = [s0]; lab[s0] = 1;
      for (let q = 0; q < cells.length; q++) { const i = cells[q], c = i % nx, r = (i / nx) | 0;
        for (const [dc, dr] of N4) { const cc = c + dc, rr = r + dr; if (cc < 0 || rr < 0 || cc >= nx || rr >= ny) continue;
          const j = rr * nx + cc; if (Zm[j] && !lab[j] && lev[j] === lev[i]) { lab[j] = 1; cells.push(j); } } }
      if (cells.length >= minCells) continue;
      const cnt = new Map();
      for (const i of cells) { const c = i % nx, r = (i / nx) | 0;
        for (const [dc, dr] of N4) { const cc = c + dc, rr = r + dr; if (cc < 0 || rr < 0 || cc >= nx || rr >= ny) continue;
          const j = rr * nx + cc; if (Zm[j] && lev[j] !== lev[i]) cnt.set(lev[j], (cnt.get(lev[j]) || 0) + 1); } }
      let best = null, bn = 0; for (const [k, v] of cnt) if (v > bn) { bn = v; best = k; }
      if (best !== null) { for (const i of cells) lev[i] = best; changed = true; }
    }
    if (!changed) break;
  }
  return lev;
}

function computeBase() {
  const { nx, ny, raw } = G, label = new Int32Array(nx * ny).fill(-1), comps = [], talud = new Uint8Array(nx * ny);
  const smooth = smoothFor(G.suav);
  for (const zone of G.zonas) {
    const Zm = new Uint8Array(nx * ny); for (const i of zone.cells) Zm[i] = 1;
    if (zone.type === 'liso') {
      const hs = zone.cells.map(i => raw[i]).sort((a, b) => a - b);
      const id = comps.length; comps.push({ h0: hs[hs.length >> 1], type: 'liso' });
      for (const i of zone.cells) label[i] = id;
    } else {
      const lev = nivelesZona(zone, Zm, smooth), seen = new Uint8Array(nx * ny);
      for (const s0 of zone.cells) {
        if (seen[s0]) continue;
        const id = comps.length, cells = [s0]; seen[s0] = 1;
        for (let q = 0; q < cells.length; q++) { const i = cells[q], c = i % nx, r = (i / nx) | 0;
          for (const [dc, dr] of N4) { const cc = c + dc, rr = r + dr; if (cc < 0 || rr < 0 || cc >= nx || rr >= ny) continue;
            const j = rr * nx + cc; if (Zm[j] && !seen[j] && lev[j] === lev[i]) { seen[j] = 1; cells.push(j); } } }
        comps.push({ h0: lev[s0] * zone.step, type: 'bancal' });
        for (const i of cells) label[i] = id;
      }
      if (zone.talud) for (const i of zone.cells) talud[i] = 1;
    }
  }
  G.base = { label, comps, talud };
}

function compose() {
  const { nx, ny, raw, base, override, edit } = G, z = Float32Array.from(raw), label = new Int32Array(nx * ny), counts = new Map();
  for (let i = 0; i < nx * ny; i++) {
    const l = override[i] >= 0 ? override[i] : base.label[i];
    label[i] = l;
    if (l >= 0) { z[i] = compOf(l).h0 + (G.offsets.get(l) || 0); counts.set(l, (counts.get(l) || 0) + 1); }
  }
  if (base.talud.some(v => v)) {                         // talud de tierra: suaviza solo junto a los muros
    const bl = boxBlur(z, nx, ny, 1, 2);
    for (let i = 0; i < nx * ny; i++) if (base.talud[i]) {
      const c = i % nx, r = (i / nx) | 0;
      for (const [dc, dr] of N4) { const cc = c + dc, rr = r + dr; if (cc >= 0 && rr >= 0 && cc < nx && rr < ny && label[rr * nx + cc] !== label[i]) { z[i] = bl[i]; break; } }
    }
  }
  for (let i = 0; i < nx * ny; i++) z[i] += edit[i];
  G.z = z; G.label = label; G.counts = counts;
}

// ---------- Deshacer (Ctrl+Z) ----------
function pushUndo() {
  G.undo.push({ zonas: G.zonas.length, suav: G.suav, offsets: new Map(G.offsets), edit: G.edit.slice(), override: G.override.slice(), manual: G.manual.map(m => ({ ...m })) });
  if (G.undo.length > 30) G.undo.shift();
  $('bDeshacer').disabled = false;
}
function undo() {
  const s = G && G.undo.pop(); if (!s) return;
  let rebase = s.suav !== G.suav;
  while (G.zonas.length > s.zonas) { const z = G.zonas.pop(); if (z.layer) zonasLayer.removeLayer(z.layer); rebase = true; }
  G.suav = s.suav; $('suav').value = s.suav; $('suavV').textContent = s.suav + ' m';
  Object.assign(G, { offsets: s.offsets, edit: s.edit, override: s.override, manual: s.manual });
  if (rebase) computeBase();
  G.sel = null; compose(); updateMesh(); infoText(); editPanel();
  $('bDeshacer').disabled = !G.undo.length; status('Deshecho.');
}
$('bDeshacer').onclick = undo;
addEventListener('keydown', e => {
  if (mode) { if (e.key === 'Enter') finishDraw(); if (e.key === 'Escape') cancelDraw(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
});

// ---------- Zonas ----------
function addZona(type, ll) {
  if (!G) return status('Primero genera el 3D.');
  const P = ll.map(toUTM), cells = [];
  for (let r = 0; r < G.ny; r++) for (let c = 0; c < G.nx; c++) { const i = r * G.nx + c; if (G.mask[i] && inside(G.x0 + c * G.res, G.y1 - r * G.res, P)) cells.push(i); }
  if (!cells.length) return status('La zona no cae dentro de tu terreno.');
  pushUndo();
  const layer = L.polygon(ll, { color: DRAW[type].color, weight: 2, fillOpacity: .12 }).addTo(zonasLayer);
  G.zonas.push({ type, cells, layer, step: +$('muro').value, talud: $('talud').checked });
  // la zona nueva manda sobre los retoques manuales previos dentro de ella
  for (const i of cells) { G.override[i] = -1; G.edit[i] = 0; }
  rebuildAll();
}
$('bTodo').onclick = () => {
  if (!G) return;
  pushUndo();

function buildMesh() {

  const { nx, ny, res } = G;
  let geo = new THREE.PlaneGeometry((nx - 1) * res, (ny - 1) * res, nx - 1, ny - 1).rotateX(-Math.PI / 2);
  idxMap = null;

function updateMesh() {
  if (!mesh) return;
  const { nx, ny, res, mask, raw, hmin } = G, Z = showGemelo ? G.z : raw, ex = +$('exag').value, sel = showGemelo ? G.sel : null;
  for (let r = 0; r < ny; r++) for (let c = 0; c < nx; c++) {
    const i = r * nx + c; let R, Gc, B;

      if (r > 0) g = Math.max(g, Math.abs(Z[i - nx] - h)); if (r < ny - 1) g = Math.max(g, Math.abs(Z[i + nx] - h));

    const k = mask[i] ? 1 : .38;

// intersección rayo–terreno por "ray marching" sobre la rejilla (mucho más rápido que el raycast por triángulos)
const ray = new THREE.Raycaster();
function heightAtWorld(x, z) {
  const { nx, ny, res, hmin } = G, W = (nx - 1) * res, H = (ny - 1) * res, Z = showGemelo ? G.z : G.raw;

  const c0 = Math.min(nx - 2, c | 0), r0 = Math.min(ny - 2, r | 0), fc = c - c0, fr = r - r0;
  const h = (Z[r0 * nx + c0] * (1 - fc) + Z[r0 * nx + c0 + 1] * fc) * (1 - fr) + (Z[(r0 + 1) * nx + c0] * (1 - fc) + Z[(r0 + 1) * nx + c0 + 1] * fc) * fr;

}
function hitTerrain(e) {
  if (!G || !mesh) return null;
  const rect = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX - rect.left) / rect.width * 2 - 1, -(e.clientY - rect.top) / rect.height * 2 + 1), camera);
  const o = ray.ray.origin, d = ray.ray.direction, W = (G.nx - 1) * G.res / 2, H = (G.ny - 1) * G.res / 2;
  const ymax = (G.hmax - G.hmin + 20) * +$('exag').value + 5;
  let t0 = 0, t1 = 1e5;
  for (const [oo, dd, lo, hi] of [[o.x, d.x, -W, W], [o.y, d.y, -20, ymax], [o.z, d.z, -H, H]]) {
    if (Math.abs(dd) < 1e-9) { if (oo < lo || oo > hi) return null; continue; }
    let a = (lo - oo) / dd, b = (hi - oo) / dd; if (a > b) [a, b] = [b, a];
    t0 = Math.max(t0, a); t1 = Math.min(t1, b);

  if (t0 > t1) return null;

  let prev = t0;
  for (let t = t0; t <= t1; t += step) {
    const x = o.x + d.x * t, y = o.y + d.y * t, z = o.z + d.z * t, h = heightAtWorld(x, z);
    if (h !== null && y <= h) {
      let a = prev, b = t;
      for (let k = 0; k < 10; k++) { const m = (a + b) / 2, hm = heightAtWorld(o.x + d.x * m, o.z + d.z * m); if (hm !== null && o.y + d.y * m <= hm) b = m; else a = m; }
      const X = o.x + d.x * b, Zw = o.z + d.z * b;
      const c = Math.round((X + W) / G.res), r = Math.round((Zw + H) / G.res);
      return { x: X, y: o.y + d.y * b, z: Zw, c, r, i: r * G.nx + c };
    }

  }

}

// aplica el pincel en cada fotograma mientras se mantiene pulsado
function applyBrush(hit, dt) {
  const { nx, ny, res, edit, z, mask } = G, R = +$('bSize').value, Rc = R / res, F = +$('bForce').value / 5;
  const c0 = Math.max(0, Math.floor(hit.c - Rc)), c1 = Math.min(nx - 1, Math.ceil(hit.c + Rc));
  const r0 = Math.max(0, Math.floor(hit.r - Rc)), r1 = Math.min(ny - 1, Math.ceil(hit.r + Rc));
  let t = stroke.tool; if (stroke.shift && t === 'subir') t = 'bajar'; else if (stroke.shift && t === 'bajar') t = 'subir';
  const rate = Math.min(dt, 50) / 1000;
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const i = r * nx + c; if (!mask[i]) continue;
    const d = Math.hypot(c - hit.c, r - hit.r) / Rc; if (d > 1) continue;
    const w = (1 - d * d) ** 2;                   // caída suave hacia el borde del pincel
    if (t === 'subir') edit[i] += w * F * 1.5 * rate;
    else if (t === 'bajar') edit[i] -= w * F * 1.5 * rate;
    else if (t === 'aplanar') edit[i] += (stroke.target - z[i]) * Math.min(1, w * F * 4 * rate);

      let s = 0, n = 0;

    }

// Muro: la línea parte los bancales que cruza; el trozo más bajo pasa a ser un bancal nuevo, «Muro» metros por debajo
function crearMuro(path) {
  if (path.length < 2) return;
  const { nx, ny, res } = G, barrier = new Uint8Array(nx * ny), P = path.map(p => [p.c, p.r]);
  const ext = (a, b) => { const dx = a[0] - b[0], dy = a[1] - b[1], L0 = Math.hypot(dx, dy) || 1; return [a[0] + dx / L0 * 3 / res, a[1] + dy / L0 * 3 / res]; };
  P.unshift(ext(P[0], P[1])); P.push(ext(P[P.length - 1], P[P.length - 2]));

    const [ax, ay] = P[k], [bx, by] = P[k + 1], n = Math.ceil(Math.hypot(bx - ax, by - ay) * 3) + 1;
    for (let s = 0; s <= n; s++) { const c = Math.round(ax + (bx - ax) * s / n), r = Math.round(ay + (by - ay) * s / n); if (c >= 0 && r >= 0 && c < nx && r < ny) barrier[r * nx + c] = 1; }
  }
  const touched = new Set(); for (let i = 0; i < nx * ny; i++) if (barrier[i] && G.label[i] >= 0) touched.add(G.label[i]);
  const step = +$('muro').value; let splits = 0;
  for (const l of touched) {
    const seen = new Uint8Array(nx * ny), parts = [];
    for (let s0 = 0; s0 < nx * ny; s0++) {
      if (seen[s0] || barrier[s0] || G.label[s0] !== l) continue;
      const cells = [s0]; seen[s0] = 1;
      for (let q = 0; q < cells.length; q++) { const i = cells[q], c = i % nx, r = (i / nx) | 0;
        for (const [dc, dr] of N4) { const cc = c + dc, rr = r + dr; if (cc < 0 || rr < 0 || cc >= nx || rr >= ny) continue;

    }
    if (parts.length < 2) continue;
    parts.sort((a, b) => b.mean - a.mean);       // el más alto (según el relieve real) se queda; los demás bajan
    const hTop = compOf(l).h0 + (G.offsets.get(l) || 0);
    for (const part of parts.slice(1)) {

}

// Alt + clic en un muro: los dos bancales que separa quedan a la misma altura (la del más alto)
function fusionar(hit) {

    const c = hit.c + dc, r = hit.r + dr; if (c < 0 || r < 0 || c >= nx || r >= ny) continue;
    const l = G.label[r * nx + c]; if (l >= 0) cnt.set(l, (cnt.get(l) || 0) + 1);
  }
  const ls = [...cnt.entries()].sort((a, b) => b[1] - a[1]).slice(0, 2).map(e => e[0]);
  if (ls.length < 2) return status('Alt + clic justo encima de un muro para fusionar los dos bancales.');
  pushUndo();
  const h = l => compOf(l).h0 + (G.offsets.get(l) || 0);
  const [hi, lo] = h(ls[0]) >= h(ls[1]) ? ls : [ls[1], ls[0]];
  G.offsets.set(lo, h(hi) - compOf(lo).h0);

// ---------- Generar ----------
$('bGenerar').onclick = async () => {
  if (mode) finishDraw();
  const poly = parcelaLayer.getLayers()[0];
  if (!poly) return status('Primero dibuja tu terreno.');
  const P = poly.getLatLngs()[0].map(toUTM);
  const xs = P.map(p => p[0]), ys = P.map(p => p[1]), pad = 25;
  const x0 = Math.floor((Math.min(...xs) - pad) / 5) * 5, x1 = Math.ceil((Math.max(...xs) + pad) / 5) * 5;
  const y0 = Math.floor((Math.min(...ys) - pad) / 5) * 5, y1 = Math.ceil((Math.max(...ys) + pad) / 5) * 5;
  if (x1 - x0 > 1500 || y1 - y0 > 1500) return status('Terreno demasiado grande para la demo (máx. ~1,5 km).');
  status('Descargando relieve (MDT IGN) y ortofoto PNOA…');
  try {
    const W = x1 - x0, H = y1 - y0;
    const [mdt, tex] = await Promise.all([fetchMDT(x0, y0, x1, y1), loadOrtho(x0, y0, x1, y1)]);
    orthoTex = tex; useOrtho = !!tex; $('bTex').textContent = useOrtho ? 'Textura: ortofoto' : 'Textura: low-poly';
    const res = Math.max(W, H) > 700 ? 2 : 1, nx = Math.round(W / res) + 1, ny = Math.round(H / res) + 1;
    const s = sampler(mdt), raw = new Float32Array(nx * ny), mask = new Uint8Array(nx * ny);
    let hmin = Infinity, hmax = -Infinity;
    for (let r = 0; r < ny; r++) for (let c = 0; c < nx; c++) {
      const x = x0 + c * res, y = y1 - r * res, i = r * nx + c;
      raw[i] = s(x, y); mask[i] = inside(x, y, P) ? 1 : 0;
      if (mask[i]) { hmin = Math.min(hmin, raw[i]); hmax = Math.max(hmax, raw[i]); }
    }
    G = { nx, ny, res, x0, y1, raw, mask, hmin, hmax, area: areaUTM(P), mdtRes: mdt.cellsize,
          smoothCache: new Map(), suav: +$('suav').value, zonas: [], offsets: new Map(),
          edit: new Float32Array(nx * ny), override: new Int32Array(nx * ny).fill(-1), manual: [], undo: [], sel: null };
    zonasLayer.clearLayers();
    ['bModo', 'bTex', 'bTodo', 'bZona', 'bLiso'].forEach(id => $(id).disabled = false);
    $('bDeshacer').disabled = true;
    $('tools').hidden = false; help.hidden = false; help.innerHTML = HELP[tool] + '<br><b>Ctrl+Z</b>: deshacer.';
    computeBase(); compose(); buildMesh(); rebuildAll();
    const span = Math.max(W, H);
    controls.target.set(0, (hmax - hmin) / 2, 0);
    camera.position.set(span * .35, span * .55 + (hmax - hmin), span * .85);
    if (!tex) status('Ortofoto PNOA no disponible ahora mismo: gemelo en low-poly. ' + $('status').textContent);
  } catch (err) { console.error(err); status('Error descargando datos del IGN: ' + (err && err.message ? err.message : 'fallo de red') + '. Vuelve a pulsar «Generar 3D».'); }
};
$('bModo').onclick = e => { showGemelo = !showGemelo; e.target.textContent = showGemelo ? 'Ver: gemelo' : 'Ver: MDT bruto'; updateMesh(); };
$('bTex').onclick = e => {
  if (!orthoTex) return status('No hay ortofoto descargada; vuelve a generar el 3D.');
  useOrtho = !useOrtho; e.target.textContent = useOrtho ? 'Textura: ortofoto' : 'Textura: low-poly'; buildMesh();
};
$('exag').oninput = e => { $('exagV').textContent = e.target.value + '×'; if (G) updateMesh(); };
$('muro').oninput = e => $('muroV').textContent = (+e.target.value).toString().replace('.', ',') + ' m';
</script>
</body>
</html>
